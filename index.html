<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.chat-container {
    width: 400px;
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
}

#chat-box {
    height: 300px;
    overflow-y: auto;
    background: #020617;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
}

.input-area {
    display: flex;
    gap: 5px;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background: #334155;
    color: white;
}

input::placeholder {
    color: #94a3b8;
}

button {
    padding: 10px 15px;
    background: #38bdf8;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #0ea5e9;
}

#mic-btn, #speak-btn {
    padding: 10px;
    min-width: 45px;
    font-size: 16px;
}

.message {
    margin: 8px 0;
    padding: 8px;
    border-radius: 5px;
}

.user {
    background: #2563eb;
}

.bot {
    background: #475569;
}
</style>
</head>

<body>

<div class="chat-container">
    <h2>🤖 AI Assistant</h2>

    <div id="chat-box"></div>

    <div class="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Type your message or say 'open YouTube'..."
            onkeypress="handleKey(event)"
        >
        <button onclick="sendMessage()">Send</button>
        <button id="mic-btn" onclick="startVoiceInput()">🎤</button>
        <button id="speak-btn" onclick="toggleSpeech()">🔊</button>
    </div>
</div>

<script>
let speechEnabled = true;

function handleKey(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
}

function sendMessage() {
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");

    let message = input.value.trim();
    if (!message) return;

    chatBox.innerHTML += `<div class="message user">👤 ${message}</div>`;

    let reply = getBotResponse(message);

    setTimeout(() => {
        chatBox.innerHTML += `<div class="message bot">🤖 ${reply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        if (speechEnabled) {
            speak(reply);
        }
    }, 500);

    input.value = "";
}

function getBotResponse(message) {
    message = message.toLowerCase();

    if (message.includes("hello") || message.includes("hi")) {
        return "Hello! How can I help you?";
    }

    if (message.includes("open youtube")) {
        window.open("https://www.youtube.com", "_blank");
        return "Opening YouTube...";
    }

    if (message.includes("open google")) {
        window.open("https://www.google.com", "_blank");
        return "Opening Google...";
    }

    if (message.includes("time")) {
        return "Current time is " + new Date().toLocaleTimeString();
    }

    return "I received: " + message;
}

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.speak(speech);
}

function toggleSpeech() {
    speechEnabled = !speechEnabled;
    alert("Speech " + (speechEnabled ? "Enabled" : "Disabled"));
}

function startVoiceInput() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech Recognition not supported.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event) {
        document.getElementById("user-input").value =
            event.results[0][0].transcript;
        sendMessage();
    };
}
</script>

</body>
</html>
