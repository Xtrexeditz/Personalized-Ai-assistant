<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <h2>🤖 AI Assistant</h2>

    <!-- Chat messages -->
    <div id="chat-box"></div>

    <!-- Input area -->
    <div class="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Type your message or say 'open YouTube'..."
            onkeypress="handleKey(event)"
        >
        <button onclick="sendMessage()">Send</button>
        <button id="mic-btn" onclick="startVoiceInput()" title="Voice Input">🎤</button>
        <button id="speak-btn" onclick="toggleSpeech()" title="Toggle Speech">🔊</button>
    </div>
</div>

<script src="script.js"></script>

<script>
function handleKey(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
}
</script>

</body>
</html>
